name: E2E Parallel Jobs

on:
  push:
    branches:
      - master
    tags:
  pull_request:

jobs:
  e2e_parallel_jobs:
    runs-on: ubuntu-24.04
    name: E2E about Parallel Jobs
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Here support the latest three minor releases of Kubernetes, this can be considered to be roughly
        # the same as the End of Life of the Kubernetes release: https://kubernetes.io/releases/
        # Please remember to update the CI Schedule Workflow when we add a new version.
        k8s: [ v1.28.0, v1.29.0, v1.30.0 ]
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x

      - name: Install musl
        run: |
          wget http://musl.libc.org/releases/musl-1.2.1.tar.gz
          tar -xf musl-1.2.1.tar.gz && cd musl-1.2.1
          ./configure
          make && sudo make install
      - uses: actions/cache@v2
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install dependences
        run: |
          GO111MODULE="on" go install sigs.k8s.io/kind@v0.23.0
          curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.30.1/bin/linux/amd64/kubectl && sudo install kubectl /usr/local/bin/kubectl
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run E2E Tests
        run: |
          make e2e-test-jobp CC=/usr/local/musl/bin/musl-gcc KUBERNETES_IMAGE=${{ matrix.k8s }}